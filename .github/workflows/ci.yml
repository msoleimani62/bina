name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy bina

      - name: Locale parity check
        run: python -c "
          import json;
          en = json.load(open('bina/locales/en.json'));
          fa = json.load(open('bina/locales/fa.json'));
          assert set(en) == set(fa), f'Locale key mismatch: {set(en) ^ set(fa)}';
          print('Locale keys match.')"

      - name: Run tests with coverage
        run: pytest
