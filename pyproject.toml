[project]
name = "bina"
version = "0.1.0"
description = "Bina — a modular, multi-user Telegram news bot with built-in translation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "msoleimani62" }]
dependencies = [
    "aiogram>=3.4,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "aiosqlite>=0.19",
    "feedparser>=6.0",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
bina-bot = "bina.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=bina --cov-report=term-missing --cov-fail-under=80"
